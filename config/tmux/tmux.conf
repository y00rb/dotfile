# Tmux Configuration
# Setup:
#   1. Copy: cp ./config/tmux/tmux.conf ~/.config/tmux/tmux.conf
#   2. Install TPM: git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
#   3. Start tmux, press prefix + I to install plugins

# ---------------------
# Prefix Key
# ---------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---------------------
# General Settings
# ---------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
set -g status-interval 5
set -g display-panes-time 2000
set -g status-position top

# ---------------------
# Keybindings
# ---------------------

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-popup -d "#{pane_current_path}" -x R -y 1 -w 22 -h 3 -S fg=green -s fg=default,bg=default -E "echo ' Config reloaded!' && sleep 1"

# Split panes (h = horizontal, v = vertical, open in current path)
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Close pane without confirmation
bind x kill-pane

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Pane navigation (M = Option on macOS)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window switching (Option + [ / ])
bind -n M-[ previous-window
bind -n M-] next-window

# Session picker (zt)
bind z display-popup -E -w 60% -h 60% "zsh -ic '_zt_connect'"

# Copy mode (vi keys)
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---------------------
# Catppuccin Theme (v2.x)
# ---------------------
# No flavor hex is hardcoded below. Structural colors use tmux's "default"
# (= whatever the terminal itself paints) and accents use the terminal's own
# 16-color ANSI palette. Catppuccin's terminal themes map palette 0-15 to the
# flavor's colors, so the status bar tracks whatever theme Ghostty/iTerm is set
# to -- switch terminal theme, reload tmux, done. No edits here, no detection.
#
# @catppuccin_flavor now supplies exactly one thing: @thm_crust, the near-black
# used for text sitting on a colored badge. The 16-color palette has no slot dark
# enough (palette 0 is surface_1, too light to read against a pastel accent), and
# crust barely moves between the dark flavors, so a stale value is invisible.
#
# Note: the plugin sets @thm_* with `set -ogq` (only-if-unset), so `source-file`
# will NOT refresh the palette on a server that already loaded another flavor --
# that needs a fresh server. Harmless here, since only crust is read.
set -g @catppuccin_flavor "frappe"

# Transparent status bar, so it is exactly the terminal's background.
# A literal "default" here is intercepted by the plugin and remapped to
# @thm_mantle -- a *darker* band, which is the bug this replaces. A format that
# *evaluates* to "default" takes the plugin's pass-through branch instead.
# This must be set before TPM runs: the rounded window separators are drawn as
# #[fg=#{@_ctp_status_bg},reverse] and get baked in at plugin-load time.
set -g @_terminal_bg "default"
set -g @catppuccin_status_background "#{@_terminal_bg}"

# Window styling
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag,(),}"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_position 0

# Accents, from the terminal palette rather than a flavor.
# Nearest ANSI slot for each Catppuccin color the default theme used:
#   overlay_2 -> white         surface_0/1 -> black
#   mauve     -> magenta       rosewater   -> white
set -g @catppuccin_window_number_color "white"
set -g @catppuccin_window_text_color "black"
set -g @catppuccin_window_current_number_color "magenta"
set -g @catppuccin_window_current_text_color "black"
set -g @catppuccin_status_module_bg_color "black"
set -g @catppuccin_session_color "#{?client_prefix,red,green}"
set -g @catppuccin_directory_color "white"

# Pane border
set -g @catppuccin_pane_border_style "fg=brightblack"
set -g @catppuccin_pane_active_border_style "fg=magenta"

# ---------------------
# Plugins
# ---------------------
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'y00rb/tmux-agent-sidebar'

# tmux-fzf-url
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# tmux-continuum
# Manual restore: prefix + Ctrl-r
# set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# Directory module config
set -g @catppuccin_directory_text " #{b:pane_current_path}"

# Initialize TPM
run '~/.config/tmux/plugins/tpm/tpm'

# ---------------------
# Status Bar Layout (MUST be after catppuccin is loaded)
# ---------------------
# Status bar inherits the terminal's own background and foreground, so it blends
# into the terminal for any theme, light or dark. (The plugin sets fg from the
# flavor; override it too so nothing here depends on the flavor.)
set -g status-style "bg=default,fg=default"

# Copy-mode selection and the clock, likewise off the terminal palette.
set -g mode-style "bg=black,bold"
set -g clock-mode-colour "blue"

# Rounded window pills, rebuilt to drop the plugin's `reverse` trick.
#
# Catppuccin draws window caps as #[fg=#{@_ctp_status_bg},reverse] -- which only
# composites correctly when the bar has a *concrete* background color. With
# bg=default, `reverse` swaps in the terminal's default FOREGROUND, painting a
# light halo around every cap. Its own status modules (session, directory) never
# had this bug because they draw the cap glyph directly in the pill color over
# the bar: #[fg=<pill color>] followed by the glyph. That is what is copied here.
#
# Rebuilt rather than overridden because the rounded branch sets the separator
# options with `set -gq`, clobbering anything set before TPM, and bakes them into
# window-status-format at plugin-load time.
set -gF window-status-format "#[fg=#{@catppuccin_window_number_color},bg=default]#[fg=#{@thm_crust},bg=#{@catppuccin_window_number_color}]#{@catppuccin_window_number}#{E:@catppuccin_window_middle_separator}#[fg=default,bg=#{@catppuccin_window_text_color}]#{@catppuccin_window_text}#{E:@catppuccin_window_flags_icon_format}#[fg=#{@catppuccin_window_text_color},bg=default]"
set -gF window-status-current-format "#[fg=#{@catppuccin_window_current_number_color},bg=default]#[fg=#{@thm_crust},bg=#{@catppuccin_window_current_number_color}]#{@catppuccin_window_current_number}#{E:@catppuccin_window_middle_separator}#[fg=default,bg=#{@catppuccin_window_current_text_color}]#{@catppuccin_window_current_text}#{E:@catppuccin_window_flags_icon_format}#[fg=#{@catppuccin_window_current_text_color},bg=default]"

# Center the window list
set -g status-justify absolute-centre

# Left: session name
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-left-length 50

# Right: directory normally, key hints when prefix is pressed
set -g status-right "#{?client_prefix,#[fg=yellow] h split  v split  c new  r reload  ? keys ,#{E:@catppuccin_status_directory}}"
set -g status-right-length 120
