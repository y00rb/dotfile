# Tmux Configuration
# Setup:
#   1. Copy: cp ./config/tmux/tmux.conf ~/.config/tmux/tmux.conf
#   2. Install TPM: git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
#   3. Start tmux, press prefix + I to install plugins

# ---------------------
# Prefix Key
# ---------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---------------------
# General Settings
# ---------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
set -g status-interval 5
set -g display-panes-time 2000
set -g status-position top

# ---------------------
# Keybindings
# ---------------------

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-popup -d "#{pane_current_path}" -x R -y 1 -w 22 -h 3 -S fg=green -s fg=default,bg=default -E "echo ' Config reloaded!' && sleep 1"

# Split panes (h = horizontal, v = vertical, open in current path)
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Close pane without confirmation
bind x kill-pane

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Pane navigation (M = Option on macOS)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window switching (Option + [ / ])
bind -n M-[ previous-window
bind -n M-] next-window

# Session picker (zt)
bind z display-popup -E -w 60% -h 60% "zsh -ic '_zt_connect'"

# Copy mode (vi keys)
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---------------------
# Catppuccin (only what it still styles)
# ---------------------
# The status bar is built by tmux-native-bar further down; catppuccin no longer
# draws any part of it. @catppuccin_flavor now affects only what catppuccin
# styles OUTSIDE the status line: message-style, popup-style and mode-style.
#
# native-bar reads no @thm_* at all while @tnb_palette is unset (its default,
# "ansi"), so the flavor never reaches the bar. Set @tnb_palette to "catppuccin"
# if you want the bar to use flavor colors the 16-color ANSI palette cannot
# express -- mauve and surface_0 -- at the cost of no longer following whatever
# theme the terminal is set to.
set -g @catppuccin_flavor "frappe"

# Pane border
set -g @catppuccin_pane_border_style "fg=brightblack"
set -g @catppuccin_pane_active_border_style "fg=magenta"

# ---------------------
# Plugins
# ---------------------
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'y00rb/tmux-agent-sidebar'
set -g @plugin 'y00rb/tmux-native-bar'

# tmux-fzf-url
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# tmux-continuum
# Manual restore: prefix + Ctrl-r
# set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'


# Initialize TPM
run '~/.config/tmux/plugins/tpm/tpm'

# ---------------------
# Overrides (MUST be after TPM: plugins rebind some keys on load)
# ---------------------
# Clear screen + scrollback (prefix + C-c). Works even for a running foreground
# program (sends nothing to it, so no literal ^L); also wipes scrollback.
bind C-c send-keys -R \; clear-history

# ---------------------
# Status Bar (tmux-native-bar)
# ---------------------
# Holds no color values: structure uses the terminal's own background and
# foreground, accents use its 16-color ANSI palette. Re-theming the terminal
# re-themes the bar with no reload, and nothing here can go stale.
# Installed via TPM above as y00rb/tmux-native-bar.

# Rebuild after ADDING a module. Color, icon and text changes need no rebuild.
bind M run-shell '~/.config/tmux/plugins/tmux-native-bar/native-bar.tmux'

# Copy-mode selection and the clock, likewise off the terminal palette.
set -g mode-style "bg=black,bold"
set -g clock-mode-colour "blue"

# Override just the right side: key hints while prefix is held. Everything else
# comes from the plugin's @tnb_layout auto.
set -g status-right "#{?client_prefix,#[fg=yellow] h split  v split  c new  r reload  ? keys ,#{E:@tnb_status_directory}}"
