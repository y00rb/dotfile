# Simulates catppuccin/tmux being loaded: only the PUBLIC @thm_* colour
# variables, never an internal. Values are Frappe's.
set -g status-position top
set -g @tnb_palette "catppuccin"
set -g @thm_mauve     "#ca9ee6"
set -g @thm_surface_0 "#414559"
set -g @thm_surface_1 "#51576d"
# @thm_overlay_2 deliberately NOT set: window_number must fall back to its
# ANSI name rather than to empty, even while the bridge is active.
